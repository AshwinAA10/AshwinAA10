    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="918" height="388" rx="14" fill="url(#stack-bg)" stroke="url(#stack-border)" stroke-width="1.5"/>
  <rect x="2" y="2" width="916" height="386" rx="13" fill="url(#stack-grid)"/>
  <rect x="2" y="2" width="916" height="386" rx="13" fill="url(#stack-glow)"/>

