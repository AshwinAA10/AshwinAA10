<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="50%" stop-color="#080c13"/>
      <stop offset="100%" stop-color="#05080c"/>
    </linearGradient>

    <!-- Border Linear Gradient -->
    <linearGradient id="hero-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Accent Glows -->
    <radialGradient id="glow-cyan" cx="15%" cy="20%" r="35%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-indigo" cx="85%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Blueprint Grid Pattern -->
    <pattern id="blueprint-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>

    <!-- Panel Filter Shadow -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="918" height="338" rx="14" fill="url(#hero-bg)" stroke="url(#hero-border)" stroke-width="1.5"/>
  
  <!-- Subtle Grids & Glows -->
  <rect x="2" y="2" width="916" height="336" rx="13" fill="url(#blueprint-grid)"/>
  <rect x="2" y="2" width="916" height="336" rx="13" fill="url(#glow-cyan)"/>
  <rect x="2" y="2" width="916" height="336" rx="13" fill="url(#glow-indigo)"/>

  <!-- Top System Bar -->
  <line x1="1" y1="44" x2="919" y2="44" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Status Chip (Left) -->
  <rect x="24" y="14" width="10" height="10" rx="3" fill="#0369a1" fill-opacity="0.4"/>
  <rect x="26" y="16" width="6" height="6" rx="2" fill="#38bdf8"/>
  <text x="42" y="25" class="mono" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.5">SYS.ID // ASHWIN-AA10</text>

  <!-- Live Beacon (Center) -->
  <g transform="translate(350, 18)">
    <circle cx="8" cy="7" r="4" fill="#10b981"/>
    <circle cx="8" cy="7" r="7" fill="none" stroke="#10b981" stroke-width="1" opacity="0.6"/>
    <text x="24" y="11" class="mono" font-size="11" font-weight="600" fill="#34d399" letter-spacing="1">STATUS : BUILDING &amp; SHIPPING</text>
  </g>

  <!-- Coordinates / Location (Right) -->
  <text x="896" y="25" text-anchor="end" class="mono" font-size="10.5" fill="#64748b" letter-spacing="1">11.0168° N, 76.9558° E · COIMBATORE, IN</text>

  <!-- Crosshairs / Technical Markers -->
  <path d="M 16 38 L 24 38 M 20 34 L 20 42" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>
  <path d="M 896 38 L 904 38 M 900 34 L 900 42" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>

  <!-- Main Identity Area -->
  <g transform="translate(40, 72)">
    <!-- Sub-tag -->
    <rect x="0" y="0" width="136" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="10" y="15" class="mono" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1.8">FULL-STACK ENG</text>

    <!-- Name -->
    <text x="0" y="62" class="sans" font-size="38" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">ASHWIN A A</text>
    
    <!-- Title / Value Prop -->
    <text x="0" y="90" class="sans" font-size="15" font-weight="500" fill="#94a3b8">
      Building robust full-stack software · Architecting backend systems · Exploring applied AI
    </text>
    
    <!-- Core Primary Stack Ribbon -->
    <g transform="translate(0, 108)">
      <text x="0" y="16" class="mono" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1">CORE ARSENAL :</text>
      
      <!-- Badges -->
      <g transform="translate(108, 0)">
        <!-- React -->
        <rect x="0" y="0" width="62" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="31" y="16" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#38bdf8">React</text>

        <!-- TypeScript -->
        <rect x="70" y="0" width="94" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="117" y="16" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#60a5fa">TypeScript</text>

        <!-- NestJS -->
        <rect x="172" y="0" width="70" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="207" y="16" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#f43f5e">NestJS</text>

        <!-- PostgreSQL -->
        <rect x="250" y="0" width="98" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="299" y="16" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#93c5fd">PostgreSQL</text>

        <!-- Prisma -->
        <rect x="356" y="0" width="68" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="390" y="16" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#cbd5e1">Prisma</text>

        <!-- Python -->
        <rect x="432" y="0" width="70" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="467" y="16" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#fbbf24">Python</text>

        <!-- Gemini API -->
        <rect x="510" y="0" width="98" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="559" y="16" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#a78bfa">Gemini AI</text>
      </g>
    </g>
  </g>

  <!-- Bottom 3 Architectural Focus Cards -->
  <g transform="translate(36, 232)">
    <!-- Card 1: Production Focus -->
    <rect x="0" y="0" width="270" height="82" rx="8" fill="#0a0f18" stroke="#1e293b" stroke-width="1" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="3" height="82" rx="1" fill="#38bdf8"/>
    <text x="18" y="24" class="mono" font-size="10.5" font-weight="700" fill="#38bdf8" letter-spacing="1">01 // PRODUCTION BUILDS</text>
    <text x="18" y="44" class="sans" font-size="12" font-weight="600" fill="#e2e8f0">End-to-End Applications</text>
    <text x="18" y="64" class="sans" font-size="11" fill="#64748b">Designing schema-first scalable systems</text>

    <!-- Card 2: Technical Focus -->
    <rect x="288" y="0" width="270" height="82" rx="8" fill="#0a0f18" stroke="#1e293b" stroke-width="1" filter="url(#card-shadow)"/>
    <rect x="288" y="0" width="3" height="82" rx="1" fill="#818cf8"/>
    <text x="306" y="24" class="mono" font-size="10.5" font-weight="700" fill="#818cf8" letter-spacing="1">02 // APPLIED AI &amp; LLMS</text>
    <text x="306" y="44" class="sans" font-size="12" font-weight="600" fill="#e2e8f0">Practical Intelligence</text>
    <text x="306" y="64" class="sans" font-size="11" fill="#64748b">Moving beyond simple wrappers into utility</text>

    <!-- Card 3: Philosophy Focus -->
    <rect x="576" y="0" width="272" height="82" rx="8" fill="#0a0f18" stroke="#1e293b" stroke-width="1" filter="url(#card-shadow)"/>
    <rect x="576" y="0" width="3" height="82" rx="1" fill="#34d399"/>
    <text x="594" y="24" class="mono" font-size="10.5" font-weight="700" fill="#34d399" letter-spacing="1">03 // CORE PHILOSOPHY</text>
    <text x="594" y="44" class="sans" font-size="12" font-weight="600" fill="#e2e8f0">Ship Small &amp; Functional</text>
    <text x="594" y="64" class="sans" font-size="11" fill="#64748b">Working software beats stalled blueprints</text>
  </g>
</svg>
