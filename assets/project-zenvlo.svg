<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <linearGradient id="zenvlo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#06090f"/>
    </linearGradient>

    <!-- Flagship Premium Border with Amber + Cyan highlights -->
    <linearGradient id="zenvlo-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.4"/>
    </linearGradient>

    <radialGradient id="zenvlo-glow" cx="10%" cy="10%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <pattern id="card-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.35"/>
    </pattern>

    <filter id="badge-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.2"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="918" height="218" rx="12" fill="url(#zenvlo-bg)" stroke="url(#zenvlo-border)" stroke-width="1.5"/>
  <rect x="2" y="2" width="916" height="216" rx="11" fill="url(#card-grid)"/>
  <rect x="2" y="2" width="916" height="216" rx="11" fill="url(#zenvlo-glow)"/>

  <!-- Left Accent Stripe -->
  <rect x="1" y="1" width="4" height="218" rx="2" fill="#f59e0b"/>

  <!-- Top Metadata Bar -->
  <g transform="translate(28, 22)">
    <!-- Priority Badge -->
    <rect x="0" y="0" width="138" height="22" rx="4" fill="#451a03" stroke="#b45309" stroke-width="1" filter="url(#badge-glow)"/>
    <text x="69" y="15" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#fbbf24" letter-spacing="1">★ FLAGSHIP BUILD</text>

    <!-- Role Badge -->
    <rect x="146" y="0" width="190" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="241" y="15" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="0.5">FOUNDER &amp; FULL-STACK DEV</text>

    <!-- Architecture Status Tag -->
    <text x="864" y="15" text-anchor="end" class="mono" font-size="10.5" fill="#f59e0b" letter-spacing="1">TIER-1 ARCHITECTURE // ACTIVE CORE</text>
  </g>

  <!-- Title & Description -->
  <g transform="translate(28, 62)">
    <text x="0" y="28" class="sans" font-size="28" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">Zenvlo CRM</text>
    <text x="0" y="58" class="sans" font-size="14" font-weight="500" fill="#cbd5e1">
      Most technically ambitious build to date — full-featured CRM platform with enterprise-ready schema design.
    </text>
    <text x="0" y="80" class="sans" font-size="13" font-weight="400" fill="#94a3b8">
      Architected from the ground up: modular REST APIs, strong relational modeling, and fluid state management.
    </text>
  </g>

  <!-- Tech Stack Pills -->
  <g transform="translate(28, 164)">
    <!-- React -->
    <rect x="0" y="0" width="68" height="26" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="34" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#38bdf8">React</text>

    <!-- TypeScript -->
    <rect x="76" y="0" width="102" height="26" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="127" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#60a5fa">TypeScript</text>

    <!-- NestJS -->
    <rect x="186" y="0" width="76" height="26" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="224" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#f43f5e">NestJS</text>

    <!-- PostgreSQL -->
    <rect x="270" y="0" width="106" height="26" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="323" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#93c5fd">PostgreSQL</text>

    <!-- Prisma -->
    <rect x="384" y="0" width="74" height="26" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="421" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#cbd5e1">Prisma</text>
  </g>

  <!-- Visual Architecture Graphic on Right -->
  <g transform="translate(680, 52)">
    <!-- Frame Box -->
    <rect x="0" y="0" width="210" height="136" rx="8" fill="#080c14" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Schema / Relational Micro Nodes -->
    <!-- Client Node -->
    <rect x="16" y="18" width="54" height="28" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="43" y="36" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#38bdf8">CLIENT</text>

    <!-- Connection Line -->
    <line x1="70" y1="32" x2="98" y2="32" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- NestJS API Gateway Node -->
    <rect x="98" y="18" width="94" height="28" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
    <text x="145" y="36" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#f43f5e">NESTJS CORE</text>

    <!-- Connection Down to DB -->
    <path d="M 145 46 L 145 74" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Prisma + Postgres Node -->
    <rect x="52" y="74" width="140" height="42" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="122" y="93" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#fbbf24">POSTGRES + PRISMA</text>
    <text x="122" y="107" text-anchor="middle" class="mono" font-size="8" fill="#64748b">RELATIONAL SCHEMAS</text>
  </g>
</svg>
