<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <linearGradient id="medialert-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c141d"/>
      <stop offset="60%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#05080c"/>
    </linearGradient>

    <linearGradient id="medialert-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.4"/>
    </linearGradient>

    <radialGradient id="medialert-glow" cx="10%" cy="10%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <pattern id="med-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="918" height="218" rx="12" fill="url(#medialert-bg)" stroke="url(#medialert-border)" stroke-width="1.5"/>
  <rect x="2" y="2" width="916" height="216" rx="11" fill="url(#med-grid)"/>
  <rect x="2" y="2" width="916" height="216" rx="11" fill="url(#medialert-glow)"/>

  <!-- Left Accent Stripe -->
  <rect x="1" y="1" width="4" height="218" rx="2" fill="#06b6d4"/>

  <!-- Top Metadata Bar -->
  <g transform="translate(28, 20)">
    <!-- Domain Badge -->
    <rect x="0" y="0" width="168" height="22" rx="4" fill="#083344" stroke="#0891b2" stroke-width="1"/>
    <text x="84" y="15" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#22d3ee" letter-spacing="1">HEALTHCARE PLATFORM</text>

    <!-- Sub-tag -->
    <rect x="176" y="0" width="160" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="256" y="15" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="0.5">MERN ARCHITECTURE</text>

    <!-- Architecture Status Tag (Right) -->
    <text x="864" y="15" text-anchor="end" class="mono" font-size="10" fill="#22d3ee" letter-spacing="1">PATIENT ADHERENCE CYCLE</text>
  </g>

  <!-- Left Content Zone (x=28..608, safe width=580) -->
  <g transform="translate(28, 56)">
    <text x="0" y="24" class="sans" font-size="26" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">MediAlert</text>
    <text x="0" y="52" class="sans" font-size="13.5" font-weight="500" fill="#cbd5e1">
      Patient adherence and healthcare notification platform built
    </text>
    <text x="0" y="74" class="sans" font-size="13" font-weight="400" fill="#94a3b8">
      with scheduled alert routines, Express REST APIs, and MongoDB.
    </text>

    <!-- Tech Stack Pills -->
    <g transform="translate(0, 106)">
      <!-- MongoDB -->
      <rect x="0" y="0" width="82" height="26" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="41" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#4ade80">MongoDB</text>

      <!-- Express.js -->
      <rect x="90" y="0" width="92" height="26" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="136" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#cbd5e1">Express.js</text>

      <!-- React -->
      <rect x="190" y="0" width="66" height="26" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="223" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#38bdf8">React</text>

      <!-- Node.js -->
      <rect x="264" y="0" width="76" height="26" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="302" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#22c55e">Node.js</text>

      <!-- Alert Engine -->
      <rect x="348" y="0" width="112" height="26" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="404" y="17" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#94a3b8">Alert Engine</text>
    </g>
  </g>

  <!-- Right Diagram Zone (x=638..888, width=250, height=146) -->
  <g transform="translate(638, 48)">
    <rect x="0" y="0" width="250" height="146" rx="8" fill="#080c14" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Heartbeat / Cadence Wave -->
    <path d="M 24 74 L 54 74 L 66 50 L 78 96 L 90 62 L 102 80 L 114 74 L 226 74" fill="none" stroke="#06b6d4" stroke-width="2"/>
    
    <!-- Alert Node -->
    <circle cx="180" cy="40" r="5" fill="#f43f5e"/>
    <circle cx="180" cy="40" r="9" fill="none" stroke="#f43f5e" stroke-width="1" opacity="0.5"/>
    <text x="194" y="44" class="mono" font-size="8.5" font-weight="700" fill="#f43f5e">DISPATCH</text>
    
    <text x="125" y="118" text-anchor="middle" class="mono" font-size="8.5" fill="#64748b">DOSAGE COMPLIANCE CYCLE</text>
  </g>
</svg>
