<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 130" width="100%" height="100%">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1018"/>
      <stop offset="60%" stop-color="#080c13"/>
      <stop offset="100%" stop-color="#05080c"/>
    </linearGradient>

    <linearGradient id="footer-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3"/>
    </linearGradient>

    <pattern id="footer-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="918" height="128" rx="12" fill="url(#footer-bg)" stroke="url(#footer-border)" stroke-width="1.5"/>
  <rect x="2" y="2" width="916" height="126" rx="11" fill="url(#footer-grid)"/>

  <!-- Top Metadata line -->
  <line x1="1" y1="38" x2="919" y2="38" stroke="#1e293b" stroke-width="1"/>

  <g transform="translate(28, 15)">
    <text x="0" y="10" class="mono" font-size="10.5" font-weight="700" fill="#38bdf8" letter-spacing="1">END OF INTERFACE // ASHWIN-AA10</text>
    <text x="864" y="10" text-anchor="end" class="mono" font-size="10" fill="#64748b">COIMBATORE, INDIA · REPO ROOT</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(28, 54)">
    <!-- Identity Stamp -->
    <text x="0" y="20" class="sans" font-size="17" font-weight="700" fill="#f8fafc">Ashwin A A</text>
    <text x="0" y="42" class="sans" font-size="13" font-weight="500" fill="#94a3b8">
      Open to software engineering opportunities, full-stack collaborations, and applied AI exploration.
    </text>
    <text x="0" y="60" class="mono" font-size="10" fill="#64748b">
      Standalone vector visual system · Handcrafted for GitHub Dark Mode · Zero external API dependencies.
    </text>

    <!-- Status Beacon on Right -->
    <g transform="translate(670, 8)">
      <rect x="0" y="0" width="194" height="34" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="18" cy="17" r="4" fill="#10b981"/>
      <circle cx="18" cy="17" r="7" fill="none" stroke="#10b981" stroke-width="1" opacity="0.5"/>
      <text x="32" y="21" class="mono" font-size="9.5" font-weight="600" fill="#34d399" letter-spacing="0.5">STATUS : AVAILABLE</text>
    </g>
  </g>
</svg>
