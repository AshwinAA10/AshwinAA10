<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 140" width="100%" height="100%">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1018"/>
      <stop offset="60%" stop-color="#080c13"/>
      <stop offset="100%" stop-color="#05080c"/>
    </linearGradient>

    <linearGradient id="footer-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3"/>
    </linearGradient>

    <pattern id="footer-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="918" height="138" rx="12" fill="url(#footer-bg)" stroke="url(#footer-border)" stroke-width="1.5"/>
  <rect x="2" y="2" width="916" height="136" rx="11" fill="url(#footer-grid)"/>

  <!-- Top Metadata line -->
  <line x1="1" y1="40" x2="919" y2="40" stroke="#1e293b" stroke-width="1"/>

  <g transform="translate(28, 16)">
    <text x="0" y="10" class="mono" font-size="10.5" font-weight="700" fill="#38bdf8" letter-spacing="1">END OF INTERFACE // ASHWIN-AA10</text>
    <text x="864" y="10" text-anchor="end" class="mono" font-size="10" fill="#64748b">COIMBATORE, INDIA · REPO ROOT</text>
  </g>

  <!-- Bottom Details & Navigation Buttons -->
  <g transform="translate(28, 58)">
    <!-- Identity Stamp -->
    <text x="0" y="22" class="sans" font-size="16" font-weight="700" fill="#f8fafc">Ashwin A A</text>
    <text x="0" y="42" class="sans" font-size="12" fill="#94a3b8">
      Open to software engineering opportunities, full-stack collaborations, and applied AI exploration.
    </text>
    <text x="0" y="60" class="mono" font-size="9.5" fill="#64748b">
      Designed with standalone, high-performance SVGs · Zero external API dependencies.
    </text>

    <!-- Interactive Navigation Pills on Right -->
    <g transform="translate(480, 16)">
      <!-- Portfolio -->
      <a href="https://ashwinaa.vercel.app" target="_blank">
        <rect x="0" y="0" width="88" height="28" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="44" y="18" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#38bdf8">Portfolio ↗</text>
      </a>

      <!-- LinkedIn -->
      <a href="https://www.linkedin.com/in/ashwinaa10/" target="_blank">
        <rect x="96" y="0" width="88" height="28" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="140" y="18" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#60a5fa">LinkedIn ↗</text>
      </a>

      <!-- GitHub -->
      <a href="https://github.com/AshwinAA10" target="_blank">
        <rect x="192" y="0" width="84" height="28" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="234" y="18" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#f8fafc">GitHub ↗</text>
      </a>

      <!-- Email -->
      <a href="mailto:ashwinaa2005@gmail.com">
        <rect x="284" y="0" width="100" height="28" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="334" y="18" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#34d399">Email Me ↗</text>
      </a>
    </g>
  </g>
</svg>
